name: Build

on: [push, pull_request]

jobs:
  ubuntu-latest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [ g++-11, g++-12, clang++-14, clang++-15 ]
        standard: [ c++14, c++17, c++20 ]
        mode: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get install g++-11 g++-12 clang-14 clang-15 -y

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/Atomic/build

      - name: Build
        shell: bash
        working-directory: ${{runner.workspace}}/Atomic/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DCMAKE_CXX_FLAGS=-std=${{ matrix.standard }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler}}; cmake --build . --config ${{ matrix.mode }}

      - name: Run Tests
        working-directory: ${{runner.workspace}}/Atomic/build
        shell: bash
        run: ./Tests
  
  ubuntu-jammy:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [ g++-9, g++-10, clang++-11, clang++-12, clang++-13, clang++-14, clang++-15 ]
        standard: [ c++14, c++17, c++2a ]
        mode: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get install g++-9 g++-10 clang-11 clang-12 clang-13 clang-14 clang-15 -y

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/Atomic/build

      - name: Build
        shell: bash
        working-directory: ${{runner.workspace}}/Atomic/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DCMAKE_CXX_FLAGS=-std=${{ matrix.standard }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler}}; cmake --build . --config ${{ matrix.mode }}

      - name: Run Tests
        working-directory: ${{runner.workspace}}/Atomic/build
        shell: bash
        run: ./Tests 

  macos:
    strategy:
      matrix:
        compiler: [ c++, g++-13, g++-14 ]
        standard: [ c++14, c++17, c++20 ]
        mode: [ Debug, Release ]
        os: [ macos-15, macos-14 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/Atomic/build

      - name: Build
        shell: bash
        working-directory: ${{runner.workspace}}/Atomic/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DCMAKE_CXX_FLAGS=-std=${{ matrix.standard }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler}}; cmake --build . --config ${{ matrix.mode }}

      - name: Run Tests
        working-directory: ${{runner.workspace}}/Atomic/build
        shell: bash
        run: ./Tests

  windows:
    strategy:
      matrix:
        compiler: [ clang, gcc, msvc-14.0, msvc-14.2 ]
        standard: [ c++14, c++17, c++20, c++23 ]
        mode: [ Debug, Release ]
        os: [ windows-2025, windows-2022 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}\build

      - name: Build
        shell: bash
        working-directory: ${{runner.workspace}}\build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DCMAKE_CXX_FLAGS=-std=${{ matrix.standard }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler}}; cmake --build . --config ${{ matrix.mode }}

      - name: Run Tests
        working-directory: ${{runner.workspace}}\build\${{ matrix.mode }}
        run: ./Tests.exe

  check-files:
    runs-on: ubuntu-latest
    steps:    
      - uses: actions/checkout@v4
        
      - name: Check File Names
        working-directory: ${{runner.workspace}}/Atomic/
        run: python ./tools/check_file_names.py 

      - name: Check Licenses
        working-directory: ${{runner.workspace}}/Atomic/
        run: python ./tools/check_licenses.py

      - name: Check Header Guards
        working-directory: ${{runner.workspace}}/Atomic/
        run: python ./tools/check_header_guards.py
        
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get install clang-format

      - name: Download Run-Clang-Format
        run: git clone https://github.com/Sarcasm/run-clang-format.git

      - name: Run Clang-Format
        working-directory: ${{runner.workspace}}/Atomic/
        run: python run-clang-format/run-clang-format.py -r --extensions h,hpp ./include/ --style=file
  
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get install clang-tidy

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/Atomic/build

      - name: Build
        shell: bash
        working-directory: ${{runner.workspace}}/Atomic/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-std=c++17 -DCMAKE_CXX_COMPILER=g++; cmake --build . --config Debug

      - name: Run Clang-Tidy
        working-directory: ${{runner.workspace}}/Atomic
        shell: bash
        run: run-clang-tidy -header-filter='.*' -p build/ -quiet
        
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get install lcov

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/Atomic/build

      - name: Build
        shell: bash
        working-directory: ${{runner.workspace}}/Atomic/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-std=c++14 -DCMAKE_CXX_COMPILER=g++ -DENABLE_COVERAGE=ON; cmake --build . --config Debug

      - name: Execute Tests
        shell: bash
        working-directory: ${{runner.workspace}}/Atomic/build
        run: make Tests; ./Tests

      - name: Generate Coverage Files
        shell: bash
        working-directory: ${{runner.workspace}}/Atomic/build
        run: lcov --capture --directory ./CMakeFiles/Tests.dir/tests/unit/ --output-file coverage.info

      - name: Generate HTML Reports
        shell: bash
        working-directory: ${{runner.workspace}}/Atomic/build
        run: genhtml coverage.info --output-directory ../coverage/

      - uses: actions/upload-artifact@v4
        with:
          name: Atomic-Coverage-Report
          path: ${{runner.workspace}}/Atomic/coverage/
          
  cppcheck-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get install cppcheck

      - name: Run CppCheck
        working-directory: ${{runner.workspace}}/Atomic
        shell: bash
        run: find ./include -name '*.hpp' | xargs cppcheck --enable=all -q --force -Iinclude/

  cppcheck-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install cppcheck

      - name: Run CppCheck
        working-directory: ${{runner.workspace}}/Atomic
        shell: bash
        run: find ./include -name '*.hpp' | xargs cppcheck --enable=all -q --force -Iinclude/
